# Local Simulated AMD SEV-SNP TEE topology for QuackXide.
#
# Simulates the 3-plane Google Cloud Confidential Space + Cloud KMS + Cloud
# Storage architecture locally:
#   1. enclave-api         -> Confidential Space workload (SimulatedSnp)
#   2. key-release-service -> Cloud KMS + STS / Attestation Verifier relying party
#   3. fake-gcs            -> Cloud Storage encrypted vault (STORAGE_EMULATOR_HOST)

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:1.49.3
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -backend
      - memory
      - -external-url
      - http://fake-gcs:4443
    ports:
      - "127.0.0.1:4443:4443"
    networks:
      - enclave_internal_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  key-release-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: key-release
    environment:
      KEY_RELEASE_BIND_ADDR: "0.0.0.0:8090"
      TEE_ATTESTATION_REQUIRED: "false"
      SIMULATED_SNP_SEED: "${SIMULATED_SNP_SEED:-quackxide-local-simulated-tee-seed-v1}"
      KEY_RELEASE_EXPECTED_MEASUREMENT_HEX: "${KEY_RELEASE_EXPECTED_MEASUREMENT_HEX:-}"
      KEY_RELEASE_EXPECTED_CONFIG_DIGEST_HEX: "${KEY_RELEASE_EXPECTED_CONFIG_DIGEST_HEX:-}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - enclave_internal_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  enclave-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: enclave-api
    depends_on:
      - fake-gcs
      - key-release-service
    environment:
      BIND_ADDR: "0.0.0.0:8080"
      METRICS_BIND_ADDR: "127.0.0.1:9464"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-quackxide-vault}"
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
      KEY_RELEASE_URL: "http://key-release-service:8090"
      TEE_ATTESTATION_REQUIRED: "false"
      FEATURE_ZK_ENABLED: "${FEATURE_ZK_ENABLED:-false}"
      SIMULATED_SNP_SEED: "${SIMULATED_SNP_SEED:-quackxide-local-simulated-tee-seed-v1}"
      SIMULATED_SNP_MEASUREMENT_HEX: "${SIMULATED_SNP_MEASUREMENT_HEX:-}"
      SIMULATED_SNP_DEBUG: "${SIMULATED_SNP_DEBUG:-false}"
      ENCLAVE_CONFIG_DIGEST_HEX: "${ENCLAVE_CONFIG_DIGEST_HEX:-}"
      JWT_HS256_SECRET: "${JWT_HS256_SECRET:-simulated-tee-local-jwt-secret-32b!!}"
      JWT_ISSUER: "${JWT_ISSUER:-quackxide.local}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-quackxide-api}"
      DEMO_TENANT_ID: "${DEMO_TENANT_ID:-}"
      DEMO_TENANT_PUBLIC_KEY_B64: "${DEMO_TENANT_PUBLIC_KEY_B64:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - public_net
      - enclave_internal_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  public_net:
    driver: bridge
  enclave_internal_net:
    driver: bridge
    internal: true
