# DEV ONLY. Local simulated TEE topology for QuackXide (ADR 0004).
#
# Simulates Confidential Space on TDX + Cloud KMS locally:
#   1. enclave-api         -> Confidential Space workload (simulated token provider)
#   2. sim-attestation     -> Google's attestation service (signs tokens, serves keys)
#   3. key-release-service -> Cloud KMS stand-in, verifying tokens before release
# and, run on demand:
#   4. seal-upload         -> the steward's browser, sealing an upload body (ADR 0012)
# enclave-api starts with an empty vault; its data arrives as a steward
# upload. It keeps its vault in the `enclave_vault` volume, so
# scripts/test-simulated-tee.sh can check that only ciphertext is stored. No
# GCS emulator accepts the uploads object_store 0.13 sends (#153).
#
# `setup_net` exists only so scripts/test-simulated-tee.sh can enroll a tenant
# key and wait for sim-attestation from the host: Docker publishes no ports
# for containers that are only on an internal network.

services:
  sim-attestation:
    build:
      context: .
      dockerfile: Dockerfile
      target: sim-attestation
    environment:
      SIM_ATTESTATION_BIND_ADDR: "0.0.0.0:8070"
      SIM_ATTESTATION_ISSUER: "http://sim-attestation:8070"
      SIM_TOKEN_HWMODEL: "${SIM_TOKEN_HWMODEL:-}"
      SIM_TOKEN_DBGSTAT: "${SIM_TOKEN_DBGSTAT:-}"
      SIM_TOKEN_IMAGE_DIGEST: "${SIM_TOKEN_IMAGE_DIGEST:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "127.0.0.1:8070:8070"
    networks:
      - enclave_internal_net
      - setup_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  key-release-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: key-release
    depends_on:
      - sim-attestation
    environment:
      KEY_RELEASE_BIND_ADDR: "0.0.0.0:8090"
      TEE_ATTESTATION_REQUIRED: "false"
      SIM_ATTESTATION_URL: "http://sim-attestation:8070"
      SIM_ATTESTATION_ISSUER: "http://sim-attestation:8070"
      KEY_RELEASE_ALLOWED_IMAGE_DIGEST: "${KEY_RELEASE_ALLOWED_IMAGE_DIGEST:-}"
      KEY_RELEASE_EXPECTED_CONFIG_DIGEST_HEX: "${KEY_RELEASE_EXPECTED_CONFIG_DIGEST_HEX:-}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - enclave_internal_net
      - setup_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  enclave-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: enclave-api
    depends_on:
      - sim-attestation
      - key-release-service
    environment:
      APP_ENV: "development"
      BIND_ADDR: "0.0.0.0:8080"
      METRICS_BIND_ADDR: "127.0.0.1:9464"
      KEY_RELEASE_URL: "http://key-release-service:8090"
      TEE_ATTESTATION_REQUIRED: "false"
      FEATURE_ZK_ENABLED: "${FEATURE_ZK_ENABLED:-false}"
      SIM_ATTESTATION_URL: "http://sim-attestation:8070"
      SIM_ATTESTATION_ISSUER: "http://sim-attestation:8070"
      ENCLAVE_CONFIG_DIGEST_HEX: "${ENCLAVE_CONFIG_DIGEST_HEX:-}"
      JWT_HS256_SECRET: "${JWT_HS256_SECRET:-simulated-tee-local-jwt-secret-32b!!}"
      JWT_ISSUER: "${JWT_ISSUER:-quackxide.local}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-quackxide-api}"
      RESEARCH_MIN_COHORT_SIZE: "${RESEARCH_MIN_COHORT_SIZE:-}"
      STORAGE_LOCAL_DIR: /var/lib/quackxide/vault
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - enclave_vault:/var/lib/quackxide/vault
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - public_net
      - enclave_internal_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Seals a synthetic cohort to the steward's public key, as the browser
  # seals an upload, and writes the body to stdout; whoever runs it sends
  # the body to enclave-api. It has no network and no private key. The
  # `tools` profile keeps `up` from starting it:
  #   docker compose -f docker-compose.simulated-tee.yml run --rm -T seal-upload \
  #     --tenant <uuid> --public-key <base64> --dataset upload_<name> > body
  seal-upload:
    build:
      context: .
      dockerfile: Dockerfile
      target: seal-upload
    profiles:
      - tools
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  enclave_vault:

networks:
  public_net:
    driver: bridge
  enclave_internal_net:
    driver: bridge
    internal: true
  setup_net:
    driver: bridge
