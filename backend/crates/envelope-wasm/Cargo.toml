[package]
name = "envelope-wasm"
description = "Browser (wasm32) build of the tenant envelope seal, for the crypto worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Envelopes and `info` strings only: no AEAD helpers, blind indexes or TOTP.
platform-crypto = { path = "../platform-crypto", default-features = false }
wasm-bindgen.workspace = true
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[dev-dependencies]
base64.workspace = true
rand.workspace = true
serde_json.workspace = true
