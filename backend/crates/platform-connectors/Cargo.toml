[package]
name = "platform-connectors"
description = "Confidential connector pipelines: OAuth2 sync, in-enclave Parquet, HPKE tenant envelopes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# DEV ONLY. Lets `connector-worker` attest through the simulated TEE
# (`SIM_ATTESTATION_URL`); without it, unattested runs are refused.
simulated = ["platform-enclave/simulated"]

[dependencies]
platform-core.workspace = true
platform-config.workspace = true
platform-crypto.workspace = true
platform-enclave.workspace = true
platform-storage.workspace = true
platform-telemetry.workspace = true
anyhow.workspace = true
arrow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
parquet.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
platform-enclave = { workspace = true, features = ["simulated"] }
proptest.workspace = true
