[package]
name = "platform-crypto"
description = "Server/enclave-side primitives: AEAD sealing, HPKE suite pin, blind indexes, TOTP, zeroized secrets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# AEAD sealing, blind indexes and TOTP. The browser build (`envelope-wasm`)
# turns it off and gets only the HPKE envelopes and their `info` strings.
server = [
    "dep:aes-gcm",
    "dep:hmac",
    "dep:rand",
    "dep:sha1",
    "dep:sha2",
    "dep:x25519-dalek",
]

[dependencies]
aes-gcm = { workspace = true, optional = true }
# `sys_rng` is the OS RNG that `hpke_seal_to_tenant` draws from, as hpke does.
getrandom = { version = "0.4", features = ["sys_rng"] }
hpke.workspace = true
hmac = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Not called: this only turns on curve25519-dalek's precomputed basepoint
# table for the server's X25519 operations. hpke builds x25519-dalek without
# default features, and nothing else on the server turned the table on once
# hpke left x25519-dalek 2. The browser build (no `server` feature) keeps the
# table out of the wasm module.
x25519-dalek = { version = "3", optional = true, default-features = false, features = ["precomputed-tables"] }
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
criterion.workspace = true
proptest.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true
x-wing.workspace = true
# Without default features, so `x25519_secrets_zeroize_on_drop` fails if hpke
# stops turning on `zeroize` itself. `static_secrets` exposes `StaticSecret`.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }

[[bench]]
name = "hpke"
harness = false
# `cargo test` runs each benchmark once, so its checks gate check.sh.
test = true
