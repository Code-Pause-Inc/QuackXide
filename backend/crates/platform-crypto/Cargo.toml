[package]
name = "platform-crypto"
description = "Server/enclave-side primitives: AEAD sealing, HPKE suite pin, blind indexes, TOTP, zeroized secrets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# AEAD sealing, blind indexes and TOTP. The browser build (`envelope-wasm`)
# turns it off and gets only the HPKE envelopes and their `info` strings.
server = ["dep:aes-gcm", "dep:hmac", "dep:sha1", "dep:sha2"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
hpke.workspace = true
hmac = { workspace = true, optional = true }
rand.workspace = true
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
