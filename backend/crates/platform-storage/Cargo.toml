[package]
name = "platform-storage"
description = "Tenant-isolated ciphertext vault: typed path factory + object_store backends (GCS, in-memory)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
platform-config.workspace = true
platform-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
bytes.workspace = true
futures.workspace = true
object_store.workspace = true
thiserror.workspace = true

[features]
default = []
# DEV ONLY. A vault on a local directory, for the simulated TEE stack
# (`docker-compose.simulated-tee.yml`). Never a default feature;
# `platform-api`'s `dev` feature and test builds enable it.
dev = []

[dev-dependencies]
platform-storage = { path = ".", features = ["dev"] }
tokio.workspace = true
