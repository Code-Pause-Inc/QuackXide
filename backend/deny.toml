# cargo-deny: run from backend/ with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception names why it does not apply and when it is revisited.
ignore = [
    # rsa (Marvin timing attack on private-key operations): used for offline
    # key generation and public-key RS256 verification; no network-facing
    # service performs RSA private-key operations. RS256 is retired by
    # ADR 0001.
    { id = "RUSTSEC-2023-0071", reason = "no network-facing RSA private-key operations; RS256 retired by ADR 0001" },
    # quick-xml DoS: parsed only from the operator's object-store responses
    # (via object_store 0.12, pinned by DataFusion 49). Fixed by the DataFusion
    # upgrade tracked in docs/PROJECT_SCOPE.md.
    { id = "RUSTSEC-2026-0194", reason = "object-store XML only; fixed by the DataFusion upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "object-store XML only; fixed by the DataFusion upgrade" },
    # Unmaintained, no advisory against the code itself; transitive via
    # DataFusion and object_store. Revisit on each DataFusion upgrade.
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time proc-macro via DataFusion; unmaintained only" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via object_store; unmaintained only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Compatible with shipping QuackXide under Apache-2.0 OR MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
