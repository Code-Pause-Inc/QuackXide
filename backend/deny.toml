# cargo-deny: run from backend/ with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception names why it does not apply and when it is revisited.
ignore = [
    # rsa (Marvin timing attack on private-key operations): used for offline
    # key generation and public-key RS256 verification; no network-facing
    # service performs RSA private-key operations. RS256 is retired by
    # ADR 0001; its removal from production tokens is decided in ADR 0006
    # and built in P37.
    { id = "RUSTSEC-2023-0071", reason = "no network-facing RSA private-key operations; RS256 retired by ADR 0001, removal per ADR 0006" },
    # quick-xml DoS (fixed in >= 0.41.0): parsed only from the operator's
    # object-store XML responses (via object_store 0.13, pinned by DataFusion
    # 55 to quick-xml 0.39). Revisit when object_store moves to quick-xml 0.41+.
    { id = "RUSTSEC-2026-0194", reason = "object-store XML only; object_store 0.13 pins quick-xml 0.39 (< 0.41.0)" },
    { id = "RUSTSEC-2026-0195", reason = "object-store XML only; object_store 0.13 pins quick-xml 0.39 (< 0.41.0)" },
    # crypto-bigint timing (fixed in >= 0.7.6): 0.5 comes in through
    # elliptic-curve 0.13 (p256 via jsonwebtoken 11 and hpke, p384 via
    # jsonwebtoken 11). The HPKE suite is X25519, and no ES256/ES384 token is
    # signed or accepted: platform tokens are RS256 or HS256, attestation
    # tokens RS256. Revisit with the hpke upgrade (P35) and a jsonwebtoken
    # release on elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "no P-256/P-384 arithmetic on secrets; elliptic-curve 0.13 pins crypto-bigint 0.5" },
    # zstd and zstd-safe (fixed in zstd >= 0.14.3, zstd-safe >= 8.2.0):
    # arrow, parquet and DataFusion 55 pin zstd 0.13. arrow-ipc and parquet
    # use the bulk API and async-compression drives zstd-safe directly, never
    # the `with_context` stream constructors (0391); zstd and zstd-safe build
    # with only `std`, without `seekable` (0398) or `legacy` (0403). Revisit
    # when arrow and parquet move to zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "no zstd with_context streams; DataFusion 55 pins zstd 0.13" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe seekable feature not enabled; DataFusion 55 pins zstd 0.13" },
    { id = "RUSTSEC-2026-0403", reason = "zstd legacy feature not enabled; DataFusion 55 pins zstd 0.13" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Compatible with shipping QuackXide under Apache-2.0 OR MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
