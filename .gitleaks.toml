# gitleaks configuration for scripts/secret-scan.sh (ci.yml and scripts/check.sh).
# docs/DATA_POLICY.md rule 3: no credentials in the repository.
#
# The default rules apply. A test-only literal that trips a rule (a
# synthetic key or token that is not, and never was, a real credential)
# is allowed here by exact value or by path, with a comment saying which
# test uses it. Never allow a whole rule or directory to silence a finding.

title = "QuackXide"

[extend]
useDefault = true

# Public X-Wing known-answer vectors (seeds, ciphertexts and shared secrets
# from @noble/post-quantum, all test-only), checked by
# backend/crates/platform-crypto/tests/hpk2_vectors.rs.
[[allowlists]]
description = "test-only X-Wing known-answer vectors"
paths = ['''^fixtures/envelope/hpk2-kem\.json$''']
