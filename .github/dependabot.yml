version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /backend/fuzz
    schedule:
      interval: weekly
    groups:
      rust-fuzz:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per update run, so actions released together (for example
    # codeql-action init, analyze, and upload-sarif) are never split.
    groups:
      actions:
        patterns: ["*"]
