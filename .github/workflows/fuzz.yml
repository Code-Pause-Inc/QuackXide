name: fuzz

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [paddle_signature, ndjson, hpke_envelope, jwt_verify, snp_report]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      # cargo-fuzz has no --locked flag; a locked fetch first fails if
      # Cargo.lock is stale, so the run below never rewrites it.
      - name: Dependencies match Cargo.lock
        working-directory: backend/fuzz
        run: cargo +nightly fetch --locked
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        working-directory: backend/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: backend/fuzz/artifacts/
