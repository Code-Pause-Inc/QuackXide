name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/check.sh
      # Replaces check.sh's development build of frontend/dist. Release mode
      # refuses the local vault and any baked-in development token (ADR 0009).
      - name: Build release frontend
        working-directory: frontend
        env:
          VITE_VAULT_MODE: http
          VITE_DEV_JWT: ""
          VITE_ADMIN_JWT: ""
        run: npm run build:release
      - name: Build release artifacts
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --locked \
            -p platform-api -p platform-connectors
          mkdir -p dist
          for bin in platform-api connector-worker; do
            cp "backend/target/release/$bin" dist/
          done
          tar -C frontend/dist -czf dist/frontend.tar.gz .
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
