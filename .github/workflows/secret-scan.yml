name: secret-scan

# Every push to every branch, so history that never reaches a pull request
# or main is scanned too: a branch with no pull request, the intermediate
# commits of a branch squash-merged over a red scan, and commit messages.
# Runs are never cancelled, so a key pushed and then force-pushed away is
# still scanned. Each run checks out the pushed commit and uses that
# branch's own .gitleaks.toml. ci.yml scans pull requests' merges.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    name: branch secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI, pinned by version and checksum, as in ci.yml.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Self-test the scan
        env:
          GITLEAKS: ./gitleaks
        run: scripts/secret-scan.sh selftest
      - name: Scan the pushed history
        env:
          GITLEAKS: ./gitleaks
        run: scripts/secret-scan.sh
