name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/check.sh

  portability:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml --workspace --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: backend/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Backend coverage
        run: |
          cargo llvm-cov --manifest-path backend/Cargo.toml --workspace --locked --summary-only \
            | tee coverage.txt
          { echo '## Backend coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --coverage --coverage.reporter=text-summary | tee coverage.txt
          { echo '## Frontend coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  release-binaries:
    name: release build has no dev binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      # The release.yml build: default features, release profile, locked.
      - name: Release build of platform-api
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --locked -p platform-api \
            --message-format=json-render-diagnostics > release-artifacts.json
      # Cargo's own report of what this build produced. target/ is not
      # evidence: the cache can restore binaries from other builds.
      - name: The release build contains no dev-only binary
        run: |
          built=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .target.name' release-artifacts.json | sort -u)
          echo "Binaries in the release build:"
          echo "$built"
          if ! grep -qx platform-api <<<"$built"; then
            echo "::error::platform-api is missing from the build report; the check cannot run"
            exit 1
          fi
          for bin in devstack; do
            if grep -qx "$bin" <<<"$built"; then
              echo "::error::the default-feature release build produced the dev-only binary $bin"
              exit 1
            fi
          done
      - name: devstack cannot be built without the dev feature
        run: |
          if cargo build --manifest-path backend/Cargo.toml --release --locked -p platform-api --bin devstack 2> devstack.err; then
            echo "::error::devstack built without --features dev"
            exit 1
          fi
          if ! grep -qE 'requires the features.*dev' devstack.err; then
            cat devstack.err
            echo "::error::building devstack failed, but not because the dev feature is off"
            exit 1
          fi


  fuzz-build:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend/fuzz
      # Build only, on stable: fuzz.yml runs the targets weekly on nightly.
      # The fuzz crate is outside the workspace, so this also catches a
      # backend/fuzz/Cargo.lock that a workspace change left stale.
      - name: Check every fuzz target
        run: cargo check --manifest-path backend/fuzz/Cargo.toml --locked --bins

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned by version and checksum. The gitleaks-action
      # wrapper needs a licence key on organization repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
