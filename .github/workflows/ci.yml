name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/check.sh

  portability:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml --workspace --locked
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.126
      - run: scripts/build-wasm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: backend/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Backend coverage
        run: |
          cargo llvm-cov --manifest-path backend/Cargo.toml --workspace --locked --summary-only \
            | tee coverage.txt
          { echo '## Backend coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.126
      - run: scripts/build-wasm.sh
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --coverage --coverage.reporter=text-summary | tee coverage.txt
          { echo '## Frontend coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  release-binaries:
    name: release build has no dev binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      # The release.yml build: default features, release profile, locked.
      - name: Release build of platform-api
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --locked -p platform-api \
            --message-format=json-render-diagnostics > release-artifacts.json
      # Cargo's own report of what this build produced. target/ is not
      # evidence: the cache can restore binaries from other builds.
      - name: The release build contains no dev-only binary
        run: |
          built=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .target.name' release-artifacts.json | sort -u)
          echo "Binaries in the release build:"
          echo "$built"
          if ! grep -qx platform-api <<<"$built"; then
            echo "::error::platform-api is missing from the build report; the check cannot run"
            exit 1
          fi
          for bin in devstack key-release query-demo sim-attestation; do
            if grep -qx "$bin" <<<"$built"; then
              echo "::error::the default-feature release build produced the dev-only binary $bin"
              exit 1
            fi
          done
      - name: Dev-only binaries cannot be built without the dev feature
        run: |
          for bin in devstack key-release query-demo sim-attestation; do
            if cargo build --manifest-path backend/Cargo.toml --release --locked -p platform-api --bin "$bin" 2> "$bin.err"; then
              echo "::error::$bin built without --features dev"
              exit 1
            fi
            if ! grep -qE 'requires the features.*dev' "$bin.err"; then
              cat "$bin.err"
              echo "::error::building $bin failed, but not because the dev feature is off"
              exit 1
            fi
          done
      # Feature edges a release build uses. Dev edges are left out: test builds
      # turn `dev`, and with it the simulator, on.
      - name: The release build has no attestation simulator
        run: |
          for crate in platform-api platform-connectors; do
            # Captured first, so a failing cargo tree fails the step instead of passing it.
            tree=$(cargo tree --manifest-path backend/Cargo.toml --locked -p "$crate" -e normal,features -i platform-enclave)
            if grep -q 'feature "simulated"' <<<"$tree"; then
              echo "::error::the release build of $crate enables platform-enclave's simulated feature"
              exit 1
            fi
          done
      - name: The release connector-worker refuses unattested syncs
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --locked -p platform-connectors --bin connector-worker
          cd "$RUNNER_TEMP"
          set +e
          TEE_ATTESTATION_REQUIRED=false timeout 20 "$GITHUB_WORKSPACE/backend/target/release/connector-worker" > worker.log 2>&1
          set -e
          if ! grep '"audit_kind":"tee.attestation"' worker.log | grep -q '"outcome":"denied"'; then
            cat worker.log
            echo "::error::the release connector-worker did not refuse attestation"
            exit 1
          fi
          if grep '"audit_kind":"connector.sync"' worker.log | grep -q '"outcome":"ok"'; then
            cat worker.log
            echo "::error::the release connector-worker synced without attestation"
            exit 1
          fi
      # The key-release service is the simulated TEE's stand-in for Cloud KMS
      # (ADR 0004). A release platform-api must refuse to start when pointed at it.
      - name: The release platform-api refuses the dev-only KEY_RELEASE_URL
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          KEY_RELEASE_URL=http://127.0.0.1:9 BIND_ADDR=127.0.0.1:0 METRICS_BIND_ADDR=127.0.0.1:0 \
            timeout 30 "$GITHUB_WORKSPACE/backend/target/release/platform-api" > platform-api.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            cat platform-api.log
            echo "::error::the release platform-api started with KEY_RELEASE_URL set"
            exit 1
          fi
          if ! grep -q 'KEY_RELEASE_URL is dev-only' platform-api.log; then
            cat platform-api.log
            echo "::error::the release platform-api exited, but not because KEY_RELEASE_URL is dev-only"
            exit 1
          fi


  fuzz-build:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend/fuzz
      # Build only, on stable: fuzz.yml runs the targets weekly on nightly.
      # The fuzz crate is outside the workspace, so this also catches a
      # backend/fuzz/Cargo.lock that a workspace change left stale.
      - name: Check every fuzz target
        run: cargo check --manifest-path backend/fuzz/Cargo.toml --locked --bins

  simulated-tee:
    name: simulated TEE end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Warms the builder from the Actions cache, so the script's own
      # `docker compose build` reuses unchanged layers, above all the
      # cargo-chef dependency layer.
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.simulated-tee.yml
          set: |
            *.cache-from=type=gha,scope=simulated-tee
            *.cache-to=type=gha,scope=simulated-tee,mode=max
      - run: scripts/test-simulated-tee.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned by version and checksum. The gitleaks-action
      # wrapper needs a licence key on organization repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
