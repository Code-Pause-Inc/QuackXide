name: browser

# The crypto worker, Web Crypto and IndexedDB in real browsers (#223 stage A,
# `npm run test:browser`). Chromium on every pull request; Chromium, Firefox
# and WebKit on main, nightly and on demand. Not a required check: the
# maintainer adds it once it is stable.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The worker imports the wasm envelope module, which is built, not committed.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # Each pull request's entry would be readable by that pull request
          # only, and would evict the required jobs' caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.126
      - run: scripts/build-wasm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests in ${{ matrix.browser }}
        id: tests
        working-directory: frontend
        env:
          BROWSERS: ${{ matrix.browser }}
        run: npm run test:browser
      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}
          path: frontend/.vitest/
          if-no-files-found: ignore
      - name: Page CSP smoke in ${{ matrix.browser }}
        if: ${{ matrix.browser == 'chromium' }}
        run: scripts/check-page-headers.sh --smoke
      # Report only (#185): browser timings and the wasm module's size. Runs
      # after the tests, also when they failed, but not when a setup step
      # failed. Never a required check.
      - name: Browser timings in ${{ matrix.browser }}
        id: timings
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: frontend
        env:
          BROWSERS: ${{ matrix.browser }}
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          status=0
          npm run bench:browser || status=$?
          wasm=src/lib/crypto/wasm/envelope_bg.wasm
          {
            echo "## Browser timings ($BROWSER_NAME)"
            echo
            echo "Report only. One shared runner; the timings run on the page's main thread."
            echo "p50 and p99 are over batch means of at least 50 ms each, not single calls;"
            echo "the cold start is one sample."
            echo
            echo '```'
            lscpu | grep -E '^(Model name|CPU\(s\)):'
            echo "$BROWSER_NAME $(node --input-type=module -e "import * as pw from 'playwright'; const b = await pw[process.env.BROWSER_NAME].launch(); console.log(b.version()); await b.close();")"
            echo '```'
            echo
            echo '| Benchmark | p50 | p99 | Samples |'
            echo '| --- | --- | --- | --- |'
            rows=$(jq -r '
              def sig3: if . == 0 then 0 else (log10 | floor) as $e | pow(10; 2 - $e) as $k | ((. * $k) | round) / $k end;
              def fmt: if . < 1 then "\(. * 1000 | sig3) µs" else "\(sig3) ms" end;
              .testResults[].assertionResults[].benchmarks[].tasks[]
              | if .latency.samplesCount == 1
                then "| \(.name) | \(.latency.mean | fmt) | | 1 |"
                else "| \(.name) | \(.latency.p50 | fmt) | \(.latency.p99 | fmt) | \(.latency.samplesCount) |"
                end' .vitest/bench.json) || rows=
            if [ -n "$rows" ]; then echo "$rows"; else echo "| (no results) | | | |"; status=1; fi
            echo
            echo "wasm envelope module: $(wc -c < "$wasm") bytes, $(gzip -c "$wasm" | wc -c) gzipped"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep timing failure traces
        if: ${{ !cancelled() && steps.timings.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}-timings
          path: frontend/.vitest/
          if-no-files-found: ignore
