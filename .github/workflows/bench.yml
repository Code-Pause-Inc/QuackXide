name: bench

# Report only: shared runners are too noisy to gate on, so nothing here
# fails on the numbers, and this is not a required check. docs/BENCHMARKS.md
# describes the method and the recorded baselines: the native HPKE envelope
# (`bench`) and the wasm envelope seal in Chromium (`wasm-seal`).

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/bench.yml"
      - "rust-toolchain.toml"
      - "scripts/bench-wasm-seal.sh"
      - "scripts/build-wasm.sh"
      - "frontend/src/lib/crypto/envelope.ts"
      - "frontend/src/lib/crypto/seal*"
      - "frontend/scripts/seal-bench-report.mjs"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
  # Builds only, to save the cache that pull requests restore.
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/bench.yml"
      - "rust-toolchain.toml"
      - "scripts/bench-wasm-seal.sh"
      - "scripts/build-wasm.sh"
      - "frontend/src/lib/crypto/envelope.ts"
      - "frontend/src/lib/crypto/seal*"
      - "frontend/scripts/seal-bench-report.mjs"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # Each pull request's entry would be readable by that pull request
          # only, and would evict the required jobs' caches. Only the
          # build-only push run saves, so no saved cache holds bench results.
          save-if: ${{ github.event_name == 'push' }}
      - name: Build the benchmarks for the cache
        if: github.event_name == 'push'
        working-directory: backend
        run: cargo bench -p platform-crypto --bench hpke --locked --no-run
      - name: HPKE envelope benchmarks
        if: github.event_name != 'push'
        working-directory: backend
        run: |
          set -o pipefail
          # In the log as well as the summary, so the machine can be read back with `gh run view --log`.
          {
            lscpu | grep -E '^(Model name|CPU\(s\)):'
            rustc -V
            cargo tree --locked -p platform-crypto -e normal --prefix none \
              | grep -E '^(hpke|aes-gcm|x25519-dalek|curve25519-dalek) v' | awk '{print $1, $2}' | sort -u
          } | tee "$RUNNER_TEMP/machine.txt"
          cargo bench -p platform-crypto --bench hpke --locked -- --noplot | tee "$RUNNER_TEMP/bench.txt"
      - name: Summary
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "## HPKE envelope benchmarks"
            echo
            echo "Reference numbers from a shared GitHub-hosted runner; they vary between runs and never gate."
            echo
            echo '```'
            cat "$RUNNER_TEMP/machine.txt" 2>/dev/null || echo "(no machine details)"
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.txt" 2>/dev/null || echo "(no benchmark output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # As above: only the build-only push run saves.
          save-if: ${{ github.event_name == 'push' }}
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.126
      - name: Build the module and synth-data for the cache
        if: github.event_name == 'push'
        run: |
          scripts/build-wasm.sh
          cargo build --manifest-path backend/Cargo.toml --locked --release -p synth-data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        if: github.event_name != 'push'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Wasm envelope seal in Chromium
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          scripts/bench-wasm-seal.sh | tee "$RUNNER_TEMP/wasm-seal.md"
      - name: Summary
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "Reference numbers from a shared GitHub-hosted runner; they vary between runs and never gate."
            echo
            cat "$RUNNER_TEMP/wasm-seal.md" 2>/dev/null || echo "(no benchmark output)"
          } >> "$GITHUB_STEP_SUMMARY"
