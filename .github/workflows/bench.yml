name: bench

# On pull requests, benchmarks the base commit and then the head in one job,
# on one runner, and warns in the job summary when a benchmark is
# significantly more than 10 % slower (scripts/bench-compare.sh). The job
# fails only when the comparison itself cannot run. Shared runners vary
# between runs, so numbers are only compared within the job. Not a required
# check.
# docs/BENCHMARKS.md describes the method, the recorded numbers and targets.
# The `wasm-seal` job runs the wasm envelope seal in Chromium and reports
# only; it fails only when a seal fails.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/bench.yml"
      - "rust-toolchain.toml"
      - "scripts/bench-wasm-seal.sh"
      - "scripts/build-wasm.sh"
      - "frontend/src/lib/crypto/envelope.ts"
      - "frontend/src/lib/crypto/seal*"
      - "frontend/scripts/seal-bench-report.mjs"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "scripts/bench-compare.sh"
      - "scripts/bench-targets.sh"
  # Builds only, to save the cache that pull requests restore.
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/bench.yml"
      - "rust-toolchain.toml"
      - "scripts/bench-wasm-seal.sh"
      - "scripts/build-wasm.sh"
      - "frontend/src/lib/crypto/envelope.ts"
      - "frontend/src/lib/crypto/seal*"
      - "frontend/scripts/seal-bench-report.mjs"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "scripts/bench-compare.sh"
      - "scripts/bench-targets.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # Each pull request's entry would be readable by that pull request
          # only, and would evict the required jobs' caches. Only the
          # build-only push run saves, so no saved cache holds bench results.
          save-if: ${{ github.event_name == 'push' }}
      - name: Build the benchmarks for the cache
        if: github.event_name == 'push'
        working-directory: backend
        run: |
          targets="$(../scripts/bench-targets.sh)"
          read -r -a benches <<<"$targets"
          cargo bench --locked "${benches[@]}" --no-run
      - name: Runner
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          # In the log as well as the summary, so the machine can be read back with `gh run view --log`.
          {
            lscpu | grep -E '^(Model name|CPU\(s\)):'
            rustc -V
            (cd backend && cargo tree --locked -p platform-crypto -e normal --prefix none) \
              | grep -E '^(hpke|aes-gcm|x25519-dalek|curve25519-dalek|x-wing|ml-kem) v' | awk '{print $1, $2}' | sort -u
          } | tee "$RUNNER_TEMP/machine.txt"
          # Only this run's comparisons may be judged, never a cached one.
          rm -rf backend/target/criterion
      - name: Benchmarks at the base commit
        if: github.event_name == 'pull_request'
        env:
          # One target dir: the head build is incremental, and both runs'
          # results land in one target/criterion.
          CARGO_TARGET_DIR: ${{ github.workspace }}/backend/target
        run: |
          set -o pipefail
          # The merge ref's first parent is the base branch as merged, so
          # this is right even when the pull request's base moved or is stacked.
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base/backend"
          targets="$("$GITHUB_WORKSPACE/scripts/bench-targets.sh")"
          read -r -a benches <<<"$targets"
          cargo bench --locked "${benches[@]}" -- --noplot --save-baseline base | tee "$RUNNER_TEMP/base.txt"
      - name: Benchmarks at the head
        if: github.event_name != 'push'
        working-directory: backend
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          compare=()
          if [[ "$EVENT" == pull_request ]]; then compare=(--baseline-lenient base); fi
          # Cargo decides freshness by mtime, and this checkout predates the
          # base build in the shared target dir: without this it reuses base's code.
          git ls-files -z | xargs -0 touch
          targets="$(../scripts/bench-targets.sh)"
          read -r -a benches <<<"$targets"
          cargo bench --locked "${benches[@]}" -- --noplot "${compare[@]}" | tee "$RUNNER_TEMP/bench.txt"
      - name: Compare with the base commit
        if: github.event_name == 'pull_request'
        run: |
          status=0
          scripts/bench-compare.sh backend/target/criterion 0.10 > "$RUNNER_TEMP/compare.md" || status=$?
          cat "$RUNNER_TEMP/compare.md"
          {
            echo "## Benchmarks: head against base"
            echo
            echo "A benchmark regresses when its whole 95 % interval is more than 10 % slower."
            echo
            cat "$RUNNER_TEMP/compare.md"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # A regression is a warning until the team decides to gate on it.
          # Exit 2 (nothing compared, bad estimates) still fails the job.
          if [[ $status == 1 ]]; then
            echo "::warning::benchmark regression, see the job summary"
            status=0
          fi
          exit "$status"
      - name: Raw output
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "## Benchmark output"
            echo
            echo "Numbers from a shared GitHub-hosted runner; compare only within one run."
            echo
            echo '```'
            cat "$RUNNER_TEMP/machine.txt" 2>/dev/null || echo "(no machine details)"
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.txt" 2>/dev/null || echo "(no head run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # As above: only the build-only push run saves.
          save-if: ${{ github.event_name == 'push' }}
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (the version backend/Cargo.lock pins)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.126
      - name: Build the module and synth-data for the cache
        if: github.event_name == 'push'
        run: |
          scripts/build-wasm.sh
          cargo build --manifest-path backend/Cargo.toml --locked --release -p synth-data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        if: github.event_name != 'push'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Wasm envelope seal in Chromium
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          scripts/bench-wasm-seal.sh | tee "$RUNNER_TEMP/wasm-seal.md"
      - name: Summary
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "Reference numbers from a shared GitHub-hosted runner; they vary between runs and never gate."
            echo
            cat "$RUNNER_TEMP/wasm-seal.md" 2>/dev/null || echo "(no benchmark output)"
          } >> "$GITHUB_STEP_SUMMARY"
